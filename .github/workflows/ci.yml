name: Nina ERP Engineering Gate

on:
  push:
    branches: [ master, main, develop, 'evolution/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nina-erp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: .NET 10 + PostgreSQL gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: ninaerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ninaerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NINAERP_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      NINAERP_EF_CONNECTION: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      Jwt__Key: ci-only-key-not-for-production-0123456789abcdef
      Jwt__Issuer: NinaERP.CI
      Jwt__Audience: NinaERP.CI
      Database__ApplyMigrationsOnStartup: 'false'
      Seed__DemoData: 'false'
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Static engineering contracts
        run: python3 scripts/validation/static_contract_checks.py
      - name: PostgreSQL engineering gate
        run: scripts/ci/run-postgres-gate.sh
      - name: API health smoke test
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/NinaERP.API/NinaERP.API.csproj -c Release --no-build --urls http://127.0.0.1:7000 > artifacts/ci/api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:7000/health > artifacts/ci/health.json; then
              cat artifacts/ci/health.json
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ci/api.log
          exit 1
      - name: Upload backend gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-gate
          path: artifacts/ci
          if-no-files-found: warn

  frontend:
    name: React production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: ninaerp-frontend-dist
          path: frontend/dist

  windows-publish:
    name: Windows x64 publish gate
    needs: [backend-postgres, frontend]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish first Windows build
        shell: pwsh
        run: ./scripts/windows/Build-FirstWindows.ps1 -Runtime win-x64 -SkipTests
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninaerp-windows-win-x64
          path: artifacts/windows
