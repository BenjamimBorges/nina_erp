name: Nina ERP Engineering Gate

on:
  push:
    branches: [ master, main, develop, 'evolution/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nina-erp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: .NET 10 + PostgreSQL gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: ninaerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ninaerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NINAERP_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      NINAERP_EF_CONNECTION: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=ninaerp_test;Username=postgres;Password=postgres_ci_only;Pooling=false
      Jwt__Key: ci-only-key-not-for-production-0123456789abcdef
      Jwt__Issuer: NinaERP.CI
      Jwt__Audience: NinaERP.CI
      Database__ApplyMigrationsOnStartup: 'false'
      Seed__DemoData: 'false'
      ASPNETCORE_ENVIRONMENT: Homologation
      NINAERP_HOMOLOGATION_CNPJ: 12.345.678/0001-95
      Features__Omnichannel: 'true'
      Features__MobileApi: 'true'
      Features__Approvals: 'true'
      Features__AdvancedBI: 'true'
      Features__Assistant: 'true'
      Features__DistributedScale: 'true'
      Distributed__HeartbeatSeconds: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Static engineering/security/data contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/static_contract_checks.py
          python3 scripts/security/static-security-audit.py
          python3 scripts/validation/homologation_seed_checks.py
      - name: PostgreSQL engineering gate
        run: scripts/ci/run-postgres-gate.sh
      - name: Homologation seed + functional/security/load API gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          export NINAERP_HOMOLOGATION_PASSWORD="Hml!${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa9#"
          dotnet run --project src/NinaERP.API/NinaERP.API.csproj -c Release --no-build -- --seed-homologation
          dotnet run --project src/NinaERP.API/NinaERP.API.csproj -c Release --no-build --urls http://127.0.0.1:7000 > artifacts/ci/api.log 2>&1 &
          api_pid=$!
          dotnet run --project src/NinaERP.API/NinaERP.API.csproj -c Release --no-build --urls http://127.0.0.1:7001 > artifacts/ci/api-replica.log 2>&1 &
          replica_pid=$!
          trap 'kill $api_pid $replica_pid 2>/dev/null || true' EXIT
          primary_healthy=0
          replica_healthy=0
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:7000/health > artifacts/ci/health.json; then primary_healthy=1; fi
            if curl --fail --silent http://127.0.0.1:7001/health > artifacts/ci/health-replica.json; then replica_healthy=1; fi
            if [[ "$primary_healthy" == "1" && "$replica_healthy" == "1" ]]; then break; fi
            sleep 1
          done
          if [[ "$primary_healthy" != "1" || "$replica_healthy" != "1" ]]; then
            cat artifacts/ci/api.log || true
            cat artifacts/ci/api-replica.log || true
            exit 1
          fi
          cat artifacts/ci/health.json
          cat artifacts/ci/health-replica.json
          sleep 6 # permite ao heartbeat das duas instâncias registrar os nós antes do smoke de cluster
          # Ordem intencional: o teste de segurança satura o rate limiter de login e roda por último.
          scripts/functional/api-homologation-smoke.sh
          python3 scripts/functional/api-transaction-e2e.py
          python3 scripts/functional/api-expansion-smoke.py
          python3 scripts/load/api-load-smoke.py
          scripts/security/api-security-smoke.sh
      - name: Upload backend gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-gate
          path: artifacts/ci
          if-no-files-found: warn

  frontend:
    name: React production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Production dependency security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: ninaerp-frontend-dist
          path: frontend/dist

  windows-publish:
    name: Windows x64 publish gate
    needs: [backend-postgres, frontend]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish and compile Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          ./scripts/windows/Build-FirstWindows.ps1 -Runtime win-x64 -BuildInstaller
      - name: Exercise Authenticode signing pipeline with CI-only certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Nina ERP CI Test Signing" -CertStoreLocation Cert:\CurrentUser\My
          try { ./scripts/windows/Sign-Artifacts.ps1 -CertificateThumbprint $cert.Thumbprint -SkipTimestamp } finally { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue }
      - name: Create release integrity manifest and package
        shell: pwsh
        run: |
          python scripts/release/create-manifest.py artifacts/windows --version 0.3.0-hml --channel candidate
          python scripts/release/package-release.py artifacts/windows --version 0.3.0-hml --output-dir artifacts/release
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninaerp-windows-win-x64
          path: |
            artifacts/windows
            artifacts/release
